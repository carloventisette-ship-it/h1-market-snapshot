name: Update FTSE MIB daily 40

on:
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: "FTSE MIB refresh mode"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - incremental
          - full
  schedule:
    - cron: "30 16 * * 1-5"
    - cron: "30 17 * * 1-5"

permissions:
  contents: write

concurrency:
  group: ftsemib-daily-pilot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check Europe Rome schedule
        id: gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LOCAL_TIME=$(TZ=Europe/Rome date +%H:%M)
          LOCAL_DOW=$(TZ=Europe/Rome date +%u)

          if [ "$LOCAL_DOW" -ge 1 ] && [ "$LOCAL_DOW" -le 5 ] && [[ "$LOCAL_TIME" > "18:29" && "$LOCAL_TIME" < "19:15" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24

      - name: Build FTSE MIB D1 40 stocks
        if: steps.gate.outputs.run == 'true'
        env:
          FTSEMIB_REFRESH_MODE: ${{ github.event_name == 'workflow_dispatch' && (inputs.refresh_mode || 'auto') || 'auto' }}
        run: node scripts/update-ftsemib.js

      - name: Commit FTSE MIB data
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ftsemib-history.json ftsemib-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update FTSE MIB daily pilot"
          git push
