name: Update FTSE MIB daily pilot

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ftsemib-daily-pilot
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build FTSE MIB D1 pilot
        env:
          IG_API_KEY: ${{ secrets.IG_API_KEY }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          IG_EPIC_ENI: ${{ vars.IG_EPIC_ENI }}
          IG_EPIC_ENEL: ${{ vars.IG_EPIC_ENEL }}
        run: node scripts/update-ftsemib.js
      - name: Commit FTSE MIB data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ftsemib-history.json ftsemib-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update FTSE MIB daily pilot"
          git push
