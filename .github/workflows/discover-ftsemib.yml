name: Inspect FTSE MIB chart source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Inspect ENI and Enel official chart sources
        run: node scripts/discover-ftsemib.js
