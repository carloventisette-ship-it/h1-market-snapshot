name: Test FTSE MIB Borsa Italiana

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test ENI and Enel official D1 OHLC
        run: node scripts/discover-ftsemib.js
