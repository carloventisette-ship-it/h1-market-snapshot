name: Update H1 market snapshot

on:
  schedule:
    # UTC superset; local gate keeps Europe/Rome 07:03-17:03 across DST.
    - cron: '3 5-16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h1-market-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Check Europe/Rome scan window
        id: window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ROME_HOUR=$(TZ=Europe/Rome date +%H)
          echo "Europe/Rome hour: $ROME_HOUR"
          if [ "$ROME_HOUR" -ge 7 ] && [ "$ROME_HOUR" -le 17 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.window.outputs.run == 'true'
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.window.outputs.run == 'true'
        run: npm install

      - name: Build H1 snapshot
        if: steps.window.outputs.run == 'true'
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: npm run snapshot

      - name: Commit snapshot
        if: steps.window.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add h1-latest.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update H1 market snapshot"
          git push
