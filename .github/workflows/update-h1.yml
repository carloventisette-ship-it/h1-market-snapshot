name: Update H1 market snapshot

on:
  schedule:
    # Run a superset in UTC; the job itself gates on Europe/Rome 07:02–17:02.\n    - cron: '2 5-16 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: h1-market-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4\n        if: steps.window.outputs.run == 'true'
        with:
          node-version: 20
      - run: npm install\n        if: steps.window.outputs.run == 'true'
      - name: Build H1 snapshot
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: npm run snapshot
      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add h1-latest.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update H1 market snapshot"
          git push
