name: Update H1 market snapshot

on:
  workflow_dispatch:
    inputs:
      refresh_mode:
        description: "H1 refresh mode"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - incremental
          - full

permissions:
  contents: write

concurrency:
  group: h1-market-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build H1 snapshot
        env:
          IG_API_KEY: ${{ secrets.IG_API_KEY }}
          IG_USERNAME: ${{ secrets.IG_USERNAME }}
          IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
          H1_REFRESH_MODE: ${{ inputs.refresh_mode || 'auto' }}
        run: npm run snapshot

      - name: Commit snapshot and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add h1-latest.json h1-history.json package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update H1 market snapshot"
          git push
